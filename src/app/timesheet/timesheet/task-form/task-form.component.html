<div class="task-form">
  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="">Task</label>
      <select name="" id="" formControlName="task">
        <option value="null" selected disabled>Select Options</option>
        @for (task of tasks; track tasks?.id) {
        <option [value]="task?.name">{{ task.name }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="">Start</label>
      <div class="input-group">
        <input
          class="form-control"
          placeholder="yyyy-mm-dd"
          name="ds"
          formControlName="start"
          ngbDatepicker
          #s="ngbDatepicker"
        />
        <button
          class="btn btn-outline-secondary bi bi-calendar3"
          (click)="s.toggle()"
          type="button"
        ></button>
      </div>
    </div>

    <div class="form-group">
      <label for="">End</label>
      <div class="input-group">
        <input
          class="form-control"
          placeholder="yyyy-mm-dd"
          name="de"
          formControlName="end"
          ngbDatepicker
          #e="ngbDatepicker"
        />
        <button
          class="btn btn-outline-secondary bi bi-calendar3"
          (click)="e.toggle()"
          type="button"
        ></button>
      </div>
    </div>

    <div class="form-group">
      <button type="submit">Save</button>
    </div>
  </form>
</div>
